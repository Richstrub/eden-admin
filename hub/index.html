<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1215">
<meta name="mobile-web-app-capable" content="yes">
<title>Eden Hub</title>
<link rel="icon" href="../favicon.ico?v=2" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub.css?v=20261014a">
</head>
<body>

<!-- loading -->
<div class="hb-gate" id="loading"><div class="hb-mark">EDEN<span>Hub</span></div><p id="loadingMsg">Loading…</p></div>

<!-- the Hub's own sign-in (done once; it stays signed in) -->
<div class="hb-gate" id="signin" hidden>
  <form id="signinForm" class="hb-signin" novalidate autocomplete="on">
    <div class="hb-mark">EDEN<span>Hub</span></div>
    <label>Hub login email<input name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="hb-btn hb-primary">Sign in</button>
    <p class="hb-msg" id="signinMsg" role="status"></p>
    <p class="hb-fine">This screen signs in once and stays signed in. Use the Hub login, not your own.</p>
  </form>
</div>

<!-- signed in, but not allowed -->
<div class="hb-gate" id="noaccess" hidden>
  <div class="hb-signin">
    <div class="hb-mark">EDEN<span>Hub</span></div>
    <p id="noaccessMsg">This login can’t open the Hub.</p>
    <button type="button" class="hb-btn" id="noaccessOut">Sign out</button>
  </div>
</div>

<!-- the Hub -->
<div class="hb" id="app" hidden>
  <header class="hb-top">
    <div class="hb-when">
      <button type="button" class="hb-logo" id="logo" aria-label="Eden. Press and hold for 3 seconds, or tap 5 times, for Hub settings">EDEN<span>Hub</span></button>
      <b class="hb-time" id="clock">--:--</b>
      <span class="hb-date" id="date"></span>
    </div>
    <section class="hb-wx" id="wx" aria-label="Weather in Syracuse">
      <p class="hb-muted">Loading the weather…</p>
    </section>
  </header>

  <section class="hb-card hb-pre" aria-labelledby="preH">
    <div class="hb-card-h"><h2 id="preH">Pre-shift</h2><span class="hb-tag" id="preWhen"></span></div>
    <div id="preBody"><p class="hb-muted">Loading…</p></div>
  </section>

  <section class="hb-card hb-prep" aria-labelledby="prepH">
    <div class="hb-card-h"><h2 id="prepH">Kitchen prep</h2><span class="hb-tag" id="prepFor"></span></div>
    <div class="hb-progress" id="prepBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="prepH">
      <div class="hb-progress-fill" id="prepFill"></div>
      <span class="hb-progress-txt" id="prepPct">–</span>
    </div>
    <p class="hb-progress-sub" id="prepSub"></p>
    <div class="hb-prep-list" id="prepBody"></div>
  </section>

  <section class="hb-card hb-cal" aria-labelledby="calH">
    <div class="hb-card-h"><h2 id="calH">Calendar</h2><span class="hb-tag">Next two weeks</span></div>
    <ul class="hb-events" id="calBody"><li class="hb-muted">Loading…</li></ul>
  </section>

  <footer class="hb-foot"><span class="hb-dot" id="netDot" aria-hidden="true"></span><span id="netText">Online</span><span id="updated"></span></footer>
</div>

<!-- Hub settings (press and hold the logo for 3 seconds, or tap it 5 times) -->
<div class="hb-sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetH">
  <div class="hb-sheet-in">
    <h2 id="sheetH">Hub settings</h2>
    <p class="hb-fine" id="sheetWho"></p>
    <div class="hb-sheet-btns">
      <button type="button" class="hb-btn" id="btnFull">Full screen</button>
      <button type="button" class="hb-btn" id="btnReload">Reload the page</button>
      <button type="button" class="hb-btn hb-danger" id="btnOut">Sign out of the Hub</button>
      <button type="button" class="hb-btn hb-primary" id="btnClose">Close</button>
    </div>
    <p class="hb-fine" id="sheetInfo"></p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="../js/prep.js?v=20261013v"></script>
<script src="hub.js?v=20261014a"></script>
</body>
</html>
